<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Дневник эмоций | Для психолога</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e2a3e;
        }

        .app-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .progress-area {
            padding: 24px 28px 12px 28px;
            background: white;
            border-bottom: 1px solid #e9edf2;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .step-badge {
            font-size: 0.75rem;
            font-weight: 600;
            background: #eef2ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 40px;
        }

        .step-bar-wrapper {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .step-bar-fill {
            width: 0%;
            height: 100%;
            background: #6366f1;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .content {
            padding: 32px 28px 40px 28px;
        }

        h2 {
            font-size: 1.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .subheading {
            color: #475569;
            font-size: 1rem;
            margin-bottom: 32px;
            border-left: 3px solid #cbd5e1;
            padding-left: 16px;
        }

        .segment-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .segment-option {
            flex: 1;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 14px 0;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
            border: 1px solid transparent;
        }

        .segment-option.selected {
            background: #4f46e5;
            color: white;
            box-shadow: 0 8px 18px -6px rgba(79, 70, 229, 0.4);
        }

        .emotion-scale {
            background: #f8fafc;
            border-radius: 60px;
            padding: 12px 16px;
        }

        .current-value {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4f46e5;
            margin: 8px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #2dd4bf, #facc15, #f97316);
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            border: 2px solid #4f46e5;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .check-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

        .emotion-chip {
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 100px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }

        .emotion-chip.selected {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        textarea {
            width: 100%;
            padding: 16px 18px;
            border-radius: 28px;
            border: 1.5px solid #e2e8f0;
            font-family: inherit;
            resize: vertical;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 16px;
        }

        button {
            background: #f1f5f9;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button.primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        button.primary:hover:not(:disabled) {
            background: #4338ca;
            transform: scale(0.98);
        }

        button.secondary:hover:not(:disabled) {
            background: #e2e8f0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-card {
            background: #fefce8;
            border-radius: 32px;
            padding: 28px;
            text-align: center;
            border: 1px solid #fde047;
        }

        .result-emoji {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        hr {
            margin: 20px 0;
            border: 0;
            height: 1px;
            background: #e2e8f0;
        }

        .telegram-btn {
            background: #26A5E4;
            color: white;
            margin-top: 16px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .telegram-btn:hover:not(:disabled) {
            background: #0088cc;
        }

        .copy-section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .copy-btn {
            background: #4f46e5;
            color: white;
            padding: 12px;
            font-size: 0.9rem;
            margin-top: 12px;
            width: 100%;
        }

        .telegram-link-btn {
            background: #26A5E4;
            color: white;
            padding: 14px;
            font-size: 1rem;
            margin-top: 12px;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border-radius: 50px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 60px;
            margin-top: 16px;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            .content {
                padding: 24px 20px;
            }
            h2 {
                font-size: 1.6rem;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="app-container" id="app"></div>

<script>
    class EmotionDiary {
        constructor(container) {
            this.container = container;
            this.answers = {
                sessionType: null,
                emotionIntensity: 5,
                feelings: [],
                physicalState: 5,
                notes: ""
            };
            this.currentStep = 0;
            this.completed = false;
            this.init();
        }

        getQuestions() {
            const isAfter = this.answers.sessionType === "После консультации";
            return [
                { id: "sessionType", text: "Когда вы проходите опрос?", type: "segment", options: ["До консультации", "После консультации"] },
                { id: "emotionIntensity", text: "Как вы оцениваете своё общее эмоциональное состояние?", type: "range", minLabel: "Очень тяжело", maxLabel: "Прекрасно" },
                { id: "feelings", text: "Какие эмоции преобладают сейчас?", type: "multiselect", options: ["Спокойствие", "Тревога", "Грусть", "Надежда", "Раздражение", "Благодарность", "Страх", "Интерес"] },
                { id: "physicalState", text: "Как чувствуете себя физически?", type: "range", minLabel: "Сильный дискомфорт", maxLabel: "Отлично, бодрость" },
                { 
                    id: "notes", 
                    text: isAfter ? "Что для вас было самым важным на консультации? Какие инсайты получили?" : "О чём хотите сказать перед консультацией? Какие ожидания?", 
                    type: "textarea", 
                    placeholder: isAfter ? "Поделитесь впечатлениями после встречи..." : "Напишите, что хотите обсудить..." 
                }
            ];
        }

        getProgressPercent() {
            if (this.completed) return 100;
            const questions = this.getQuestions();
            let answered = 0;
            if (this.answers.sessionType) answered++;
            if (this.answers.emotionIntensity !== undefined) answered++;
            if (this.answers.feelings && this.answers.feelings.length > 0) answered++;
            if (this.answers.physicalState !== undefined) answered++;
            if (this.answers.notes && this.answers.notes.trim() !== "") answered++;
            return Math.min(100, Math.floor((answered / questions.length) * 100));
        }

        setAnswer(questionId, value) {
            this.answers[questionId] = value;
            if (!this.completed) this.renderQuestionScreen();
        }

        nextStep() {
            const questions = this.getQuestions();
            const currentQ = questions[this.currentStep];
            
            if (currentQ.id === "sessionType" && !this.answers.sessionType) {
                alert("Пожалуйста, выберите: до или после консультации 💙");
                return;
            }
            
            if (this.currentStep < questions.length - 1) {
                this.currentStep++;
                this.renderQuestionScreen();
            } else {
                this.completed = true;
                this.renderResultScreen();
            }
        }

        prevStep() {
            if (this.currentStep > 0) {
                this.currentStep--;
                this.renderQuestionScreen();
            }
        }

        reset() {
            this.answers = {
                sessionType: null,
                emotionIntensity: 5,
                feelings: [],
                physicalState: 5,
                notes: ""
            };
            this.currentStep = 0;
            this.completed = false;
            this.renderQuestionScreen();
        }

        getEmotionMoodEmoji(intensity) {
            if (intensity <= 2) return "😔🌧️";
            if (intensity <= 4) return "😐🌥️";
            if (intensity <= 7) return "🙂☀️";
            return "😊🌈✨";
        }

        getMoodDescription(intensity) {
            if (intensity <= 2) return "состояние нуждается в поддержке";
            if (intensity <= 4) return "нейтрально-сниженный фон";
            if (intensity <= 7) return "умеренно позитивный настрой";
            return "высокий эмоциональный ресурс";
        }

        formatMessage() {
            const intensity = this.answers.emotionIntensity || 5;
            const physical = this.answers.physicalState || 5;
            const session = this.answers.sessionType || "консультации";
            const feelings = this.answers.feelings.length ? this.answers.feelings.join(", ") : "не указаны";
            const notes = this.answers.notes?.trim() || "—";
            const moodEmoji = this.getEmotionMoodEmoji(intensity);
            const moodDesc = this.getMoodDescription(intensity);
            const isAfter = this.answers.sessionType === "После консультации";
            const timestamp = new Date().toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
            const recordId = Date.now().toString().slice(-6);
            
            return `📊 Новая запись в дневнике эмоций #${recordId}

🕐 Время: ${timestamp}
📋 Тип: ${session}

😊 Эмоциональное состояние: ${intensity}/10 ${moodEmoji}
📝 Описание: ${moodDesc}

💭 Преобладающие эмоции: ${feelings}

🧘 Физическое самочувствие: ${physical}/10

${isAfter ? '💡 Инсайты после консультации:' : '🎯 Ожидания и заметки:'} 
${notes}

---
Отправлено через Дневник эмоций`;
        }

        copyToClipboard() {
            const message = this.formatMessage();
            navigator.clipboard.writeText(message).then(() => {
                const msgDiv = document.getElementById("telegramMessage");
                if (msgDiv) {
                    msgDiv.className = "success-message";
                    msgDiv.innerHTML = "✅ Текст скопирован! Теперь отправьте его боту в Telegram.";
                    setTimeout(() => {
                        msgDiv.style.opacity = "0";
                        setTimeout(() => {
                            msgDiv.innerHTML = "";
                            msgDiv.className = "";
                            msgDiv.style.opacity = "1";
                        }, 2000);
                    }, 3000);
                }
            });
        }

        sendToTelegram() {
            const message = this.formatMessage();
            const encodedMessage = encodeURIComponent(message);
            const telegramUrl = `https://t.me/diaryemotionspsy_bot?text=${encodedMessage}`;
            window.open(telegramUrl, '_blank');
        }

        renderResultScreen() {
            const intensity = this.answers.emotionIntensity || 5;
            const physical = this.answers.physicalState || 5;
            const session = this.answers.sessionType || "консультации";
            const feelings = this.answers.feelings.length ? this.answers.feelings.join(", ") : "не указаны";
            const notes = this.answers.notes?.trim() || "—";
            const moodEmoji = this.getEmotionMoodEmoji(intensity);
            const moodDesc = this.getMoodDescription(intensity);
            const isAfter = this.answers.sessionType === "После консультации";
            const notesLabel = isAfter ? "📝 Инсайты после консультации:" : "📝 Заметки перед консультацией:";

            const html = `
                <div class="card fade-in">
                    <div class="progress-area">
                        <div class="progress-steps">
                            <span class="step-badge">✨ Дневник готов ✨</span>
                            <div class="step-bar-wrapper"><div class="step-bar-fill" style="width:100%"></div></div>
                        </div>
                    </div>
                    <div class="content">
                        <div class="result-card">
                            <div class="result-emoji">${moodEmoji}</div>
                            <h2 style="font-size:1.5rem;">Ваш эмоциональный снимок</h2>
                            <p style="margin: 12px 0;"><strong>${session}</strong> · Оценка: ${intensity}/10</p>
                            <p>${moodDesc}</p>
                            <hr />
                            <div style="text-align: left;">
                                <p><strong>💭 Преобладающие эмоции:</strong> ${feelings}</p>
                                <p><strong>🧘 Физическое самочувствие:</strong> ${physical}/10</p>
                                <p><strong>${notesLabel}</strong><br>${notes}</p>
                            </div>
                            
                            <button class="primary telegram-btn" id="sendTelegramBtn">
                                📤 Отправить психологу в Telegram
                            </button>
                            
                            <button class="secondary" id="copyBtn" style="margin-top: 12px; width:100%;">
                                📋 Скопировать текст
                            </button>
                            
                            <div id="telegramMessage"></div>
                            
                            <div class="copy-section">
                                <div style="font-weight: 600; margin-bottom: 12px;">📌 Как отправить психологу:</div>
                                <div style="font-size: 0.85rem; color: #475569; margin-bottom: 12px;">
                                    1️⃣ Нажмите кнопку выше — откроется Telegram<br>
                                    2️⃣ Если бот не открылся, нажмите кнопку ниже<br>
                                    3️⃣ Отправьте сообщение (оно уже будет вставлено)
                                </div>
                                <a href="https://t.me/diaryemotionspsy_bot" target="_blank" class="telegram-link-btn">
                                    🔗 Открыть бота @diaryemotionspsy_bot
                                </a>
                            </div>
                            
                            <button class="secondary" id="restartBtn" style="margin-top: 20px; width:100%; background:#f1f5f9;">
                                📝 Заполнить заново
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            this.container.innerHTML = html;
            
            document.getElementById("sendTelegramBtn")?.addEventListener("click", () => this.sendToTelegram());
            document.getElementById("copyBtn")?.addEventListener("click", () => this.copyToClipboard());
            document.getElementById("restartBtn")?.addEventListener("click", () => this.reset());
        }

        renderQuestionScreen() {
            const questions = this.getQuestions();
            const currentQ = questions[this.currentStep];
            const progressPercent = this.getProgressPercent();
            const isFirst = this.currentStep === 0;
            const isLast = this.currentStep === questions.length - 1;

            let questionBody = "";

            switch (currentQ.type) {
                case "segment":
                    questionBody = `
                        <div class="segment-group" id="segmentGroup">
                            ${currentQ.options.map(opt => `
                                <div class="segment-option ${this.answers.sessionType === opt ? 'selected' : ''}" data-value="${opt}">
                                    ${opt}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    break;
                case "range":
                    const rangeVal = currentQ.id === "emotionIntensity" ? this.answers.emotionIntensity : this.answers.physicalState;
                    questionBody = `
                        <div class="emotion-scale">
                            <div class="current-value" id="currentValue">${rangeVal} / 10</div>
                            <input type="range" id="rangeSlider" min="0" max="10" step="1" value="${rangeVal}">
                            <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size:0.8rem; color:#666;">
                                <span>😟 0 - Очень плохо</span>
                                <span>😊 10 - Отлично</span>
                            </div>
                        </div>
                    `;
                    break;
                case "multiselect":
                    questionBody = `
                        <div class="check-group" id="multiselectGroup">
                            ${currentQ.options.map(emo => `
                                <div class="emotion-chip ${this.answers.feelings.includes(emo) ? 'selected' : ''}" data-emotion="${emo}">
                                    ${emo}
                                </div>
                            `).join('')}
                        </div>
                        <p style="font-size:0.7rem; color:#666; margin-top:8px;">✓ Нажмите, чтобы выбрать несколько эмоций</p>
                    `;
                    break;
                case "textarea":
                    questionBody = `<textarea id="notesArea" rows="5" placeholder="${currentQ.placeholder}">${this.answers.notes || ""}</textarea>`;
                    break;
            }

            const html = `
                <div class="card fade-in">
                    <div class="progress-area">
                        <div class="progress-steps">
                            <span class="step-badge">Вопрос ${this.currentStep + 1} / ${questions.length}</span>
                            <div class="step-bar-wrapper"><div class="step-bar-fill" style="width:${progressPercent}%"></div></div>
                        </div>
                    </div>
                    <div class="content">
                        <h2>${currentQ.text}</h2>
                        <div class="subheading">
                            ${currentQ.id === "sessionType" ? "Выберите контекст — от этого зависят следующие вопросы" : 
                              currentQ.id === "notes" ? (this.answers.sessionType === "После консультации" ? "Поделитесь впечатлениями 🌟" : "Что важно обсудить? 🎯") :
                              "Будьте честны с собой 🌱"}
                        </div>
                        <div class="question">
                            ${questionBody}
                        </div>
                        <div class="actions">
                            <button class="secondary" id="prevBtn" ${isFirst ? 'disabled' : ''}>← Назад</button>
                            <button class="primary" id="nextBtn">${isLast ? 'Завершить опрос' : 'Далее →'}</button>
                        </div>
                    </div>
                </div>
            `;
            
            this.container.innerHTML = html;
            this.attachEvents(currentQ);
        }

        attachEvents(q) {
            if (q.type === "segment") {
                document.querySelectorAll(".segment-option").forEach(opt => {
                    opt.onclick = () => {
                        this.setAnswer("sessionType", opt.dataset.value);
                        if (this.currentStep > 0) this.currentStep = 1;
                        this.renderQuestionScreen();
                    };
                });
            }
            if (q.type === "range") {
                const slider = document.getElementById("rangeSlider");
                const display = document.getElementById("currentValue");
                if (slider) {
                    slider.oninput = () => {
                        const v = parseInt(slider.value);
                        display.textContent = `${v} / 10`;
                        this.answers[q.id] = v;
                    };
                }
            }
            if (q.type === "multiselect") {
                document.querySelectorAll(".emotion-chip").forEach(chip => {
                    chip.onclick = () => {
                        const emo = chip.dataset.emotion;
                        let current = [...this.answers.feelings];
                        if (current.includes(emo)) {
                            current = current.filter(e => e !== emo);
                            chip.classList.remove("selected");
                        } else {
                            current.push(emo);
                            chip.classList.add("selected");
                        }
                        this.answers.feelings = current;
                    };
                });
            }
            if (q.type === "textarea") {
                const ta = document.getElementById("notesArea");
                if (ta) {
                    ta.oninput = () => this.answers.notes = ta.value;
                }
            }
            
            const nextBtn = document.getElementById("nextBtn");
            const prevBtn = document.getElementById("prevBtn");
            
            if (nextBtn) nextBtn.onclick = () => this.nextStep();
            if (prevBtn && this.currentStep > 0) prevBtn.onclick = () => this.prevStep();
        }

        init() {
            this.renderQuestionScreen();
        }
    }

    const app = new EmotionDiary(document.getElementById("app"));
</script>
</body>
</html>
