<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Дневник эмоций | Тёплое пространство</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3f0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c2c2c;
        }

        .app-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 20;
            border: 1px solid #e2ddd8;
            transition: 0.2s;
            color: #7c6e65;
        }
        .settings-btn:hover { background: white; transform: scale(1.02); }

        .card {
            background: #ffffffea;
            border-radius: 40px;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.06);
            overflow: hidden;
            border: 1px solid #eae6e1;
        }

        .progress-area {
            padding: 20px 28px 12px 28px;
            background: transparent;
            border-bottom: 1px solid #f0ede8;
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .step-badge {
            font-size: 0.75rem;
            font-weight: 500;
            background: #f2efe9;
            color: #8f7e72;
            padding: 6px 14px;
            border-radius: 40px;
        }
        .step-bar-wrapper {
            flex: 1;
            height: 4px;
            background: #e8e3dd;
            border-radius: 4px;
            overflow: hidden;
        }
        .step-bar-fill {
            width: 0%;
            height: 100%;
            background: #b7a18a;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .content {
            padding: 28px 28px 36px;
        }

        h2 {
            font-size: 1.7rem;
            font-weight: 500;
            margin-bottom: 12px;
            color: #3d352e;
            letter-spacing: -0.3px;
        }

        .subheading {
            color: #9b8c7e;
            font-size: 0.95rem;
            margin-bottom: 28px;
            border-left: 2px solid #ddd6cf;
            padding-left: 14px;
        }

        .welcome-card {
            background: #faf7f4;
            border-radius: 36px;
            padding: 40px 28px;
            text-align: center;
        }
        .welcome-card h1 {
            font-size: 1.9rem;
            font-weight: 500;
            color: #4a3f36;
            margin-bottom: 12px;
        }
        .welcome-card p {
            color: #9b8c7e;
            margin-bottom: 28px;
        }
        .number-input-wrapper {
            background: #ffffff;
            border-radius: 60px;
            padding: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border: 1px solid #e2ddd8;
        }
        .number-input-wrapper input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 60px;
            border: none;
            font-size: 0.95rem;
            background: white;
            color: #3d352e;
            text-align: center;
        }
        .welcome-btn {
            background: #e5dfd8;
            color: #4a3f36;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            width: 100%;
        }
        .welcome-btn:hover { background: #dbd2c9; }

        .segment-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .segment-option {
            flex: 1;
            background: #f2efe9;
            border-radius: 60px;
            padding: 12px 0;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #7c6e65;
            border: 1px solid #e2ddd8;
        }
        .segment-option.selected {
            background: #e5dfd8;
            color: #4a3f36;
            border-color: #cdc3b9;
        }

        .emotion-scale {
            background: #faf8f6;
            border-radius: 40px;
            padding: 16px 20px;
        }
        .current-value {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #b7a18a;
            margin: 8px 0;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #e8e3dd;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid #cdc3b9;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: transform 0.05s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        .check-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        .emotion-chip {
            background: #f2efe9;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2ddd8;
            color: #7c6e65;
        }
        .emotion-chip.selected {
            background: #e5dfd8;
            color: #4a3f36;
            border-color: #cdc3b9;
        }

        textarea {
            width: 100%;
            padding: 16px 18px;
            border-radius: 28px;
            border: 1px solid #e2ddd8;
            font-family: inherit;
            resize: vertical;
            font-size: 0.95rem;
            background: white;
        }
        textarea:focus {
            outline: none;
            border-color: #cdc3b9;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
            gap: 12px;
        }
        button {
            background: #f2efe9;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.2s;
            color: #5e5146;
        }
        button.primary {
            background: #e5dfd8;
            color: #4a3f36;
        }
        button.primary:hover { background: #dbd2c9; }
        button.secondary:hover { background: #e8e2db; }

        .result-card {
            background: #fefcf9;
            border-radius: 32px;
            padding: 28px;
            text-align: center;
            border: 1px solid #efe8e1;
        }
        .result-emoji {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        hr {
            margin: 20px 0;
            border: 0;
            height: 1px;
            background: #eae3db;
        }
        .telegram-btn {
            background: #e5dfd8;
            color: #4a3f36;
            margin-top: 16px;
            width: 100%;
        }
        .telegram-btn:hover { background: #dbd2c9; }

        .response-card {
            background: #fefcf9;
            border-radius: 28px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            animation: slideUp 0.4s ease;
            border-left: 4px solid;
        }
        .response-card.poor { border-left-color: #c9aa9a; background: #fefaf7; }
        .response-card.medium { border-left-color: #d4bfa8; background: #fefaf7; }
        .response-card.good { border-left-color: #b7be8f; background: #fefaf7; }
        .response-card.excellent { border-left-color: #c0b38a; background: #fefaf7; }
        .response-emoji { font-size: 2rem; margin-bottom: 8px; }
        .response-title { font-size: 1.2rem; font-weight: 500; margin-bottom: 8px; color: #5e5146; }
        .response-text { font-size: 0.9rem; color: #9b8c7e; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: white;
            border-radius: 36px;
            padding: 28px;
            max-width: 360px;
            width: 90%;
            text-align: center;
        }
        .modal-card input {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: 1px solid #e2ddd8;
            margin: 16px 0;
        }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-save { background: #e5dfd8; color: #4a3f36; }
        .modal-cancel { background: #f2efe9; }

        @media (max-width: 550px) {
            .content { padding: 24px 20px; }
            h2 { font-size: 1.5rem; }
        }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="app-container" id="app"></div>

<script>
    const BOT_USERNAME = "diaryemotionspsy_bot";
    let userNumber = localStorage.getItem('userNumber') || null;

    class EmotionDiary {
        constructor(container) {
            this.container = container;
            this.answers = {
                sessionType: null,
                emotionIntensity: 5,
                feelings: [],
                physicalState: 5,
                anxiety: 5,
                sleep: 5,
                energy: 5,
                social: 5,
                afterTone: 5,
                notes: ""
            };
            this.currentStep = 0;
            this.completed = false;
            this.isRegistered = !!userNumber;
            this.init();
        }

        getQuestions() {
            const isAfter = this.answers.sessionType === "После консультации";
            const baseQuestions = [
                { id: "sessionType", text: "Когда вы проходите опрос?", type: "segment", options: ["До консультации", "После консультации"] },
                { id: "emotionIntensity", text: "Как вы оцениваете своё общее эмоциональное состояние?", type: "range" },
                { id: "feelings", text: "Какие эмоции преобладают сейчас?", type: "multiselect", options: ["Спокойствие", "Тревога", "Грусть", "Надежда", "Раздражение", "Благодарность", "Страх", "Интерес"] },
                { id: "anxiety", text: "Какой сейчас уровень тревоги?", type: "range" },
                { id: "sleep", text: "Как вы спали последнюю ночь?", type: "range" },
                { id: "energy", text: "Как вы оцениваете свою энергию / усталость?", type: "range" },
                { id: "social", text: "Насколько хочется общаться с другими?", type: "range" },
                { id: "physicalState", text: "Как чувствуете себя физически?", type: "range" }
            ];
            if (isAfter) {
                baseQuestions.push({ id: "afterTone", text: "Как изменилось ваше общее состояние после консультации?", type: "range" });
            }
            baseQuestions.push({ id: "notes", text: isAfter ? "Что для вас было самым важным на консультации?" : "О чём хотите сказать перед консультацией?", type: "textarea", placeholder: isAfter ? "Поделитесь впечатлениями..." : "Напишите, что хотите обсудить..." });
            return baseQuestions;
        }

        getProgressPercent() {
            if (this.completed) return 100;
            const qs = this.getQuestions();
            let a = 0;
            if (this.answers.sessionType) a++;
            if (this.answers.emotionIntensity !== undefined) a++;
            if (this.answers.feelings.length) a++;
            if (this.answers.anxiety !== undefined) a++;
            if (this.answers.sleep !== undefined) a++;
            if (this.answers.energy !== undefined) a++;
            if (this.answers.social !== undefined) a++;
            if (this.answers.physicalState !== undefined) a++;
            if (this.answers.afterTone !== undefined) a++;
            if (this.answers.notes?.trim()) a++;
            return Math.min(100, Math.floor((a / qs.length) * 100));
        }

        setAnswer(id, val) { this.answers[id] = val; if (!this.completed && this.isRegistered) this.renderQuestionScreen(); }

        nextStep() {
            const qs = this.getQuestions();
            const cur = qs[this.currentStep];
            if (cur.id === "sessionType" && !this.answers.sessionType) { alert("Выберите: до или после консультации"); return; }
            if (this.currentStep < qs.length - 1) { this.currentStep++; this.renderQuestionScreen(); }
            else { this.completed = true; this.renderResultScreen(); }
        }

        prevStep() { if (this.currentStep > 0) { this.currentStep--; this.renderQuestionScreen(); } }

        reset() {
            this.answers = {
                sessionType: null,
                emotionIntensity: 5,
                feelings: [],
                physicalState: 5,
                anxiety: 5,
                sleep: 5,
                energy: 5,
                social: 5,
                afterTone: 5,
                notes: ""
            };
            this.currentStep = 0;
            this.completed = false;
            this.renderQuestionScreen();
        }

        getMoodDescription() {
            const e = this.answers.emotionIntensity || 5;
            const p = this.answers.physicalState || 5;
            const a = this.answers.anxiety || 5;
            const avg = (e + p + (10 - a)) / 3;
            if (avg <= 3) return "состояние нуждается в поддержке";
            if (avg <= 5) return "нейтрально-сниженный фон";
            if (avg <= 7) return "умеренно позитивный настрой";
            return "высокий эмоциональный ресурс";
        }

        getMoodEmoji() {
            const e = this.answers.emotionIntensity || 5;
            const p = this.answers.physicalState || 5;
            const a = this.answers.anxiety || 5;
            const avg = (e + p + (10 - a)) / 3;
            if (avg <= 3) return "😔🌧️";
            if (avg <= 5) return "😐🌥️";
            if (avg <= 7) return "🙂☀️";
            return "😊🌈✨";
        }

        getResponseCard() {
            const inten = this.answers.emotionIntensity || 5;
            if (this.answers.sessionType !== "После консультации") return null;
            let emoji, title, text, bg;
            if (inten <= 3) { emoji='💔🌧️'; title='Нам искренне жаль…'; text='Мы видим, что вам сейчас непросто. Вы не одни. Администратор свяжется с вами. 💙'; bg='poor'; }
            else if (inten <= 6) { emoji='🌤️🤝'; title='Спасибо, что делитесь'; text='Каждый шаг имеет значение. Мы рядом, чтобы помочь вам двигаться дальше. 🌱'; bg='medium'; }
            else if (inten <= 8) { emoji='🌸✨'; title='Мы очень рады!'; text='Как здорово, что вам стало легче! Продолжайте в том же духе 💖'; bg='good'; }
            else { emoji='🎉🌟🌺'; title='Восхитительно! ✨'; text='Вы проделали огромную работу! Спасибо за доверие! 💫'; bg='excellent'; }
            return `<div class="response-card ${bg}"><div class="response-emoji">${emoji}</div><div class="response-title">${title}</div><div class="response-text">${text}</div></div>`;
        }

        formatMessage() {
            const e = this.answers.emotionIntensity || 5;
            const p = this.answers.physicalState || 5;
            const a = this.answers.anxiety || 5;
            const sl = this.answers.sleep || 5;
            const en = this.answers.energy || 5;
            const soc = this.answers.social || 5;
            const after = this.answers.afterTone || null;
            const s = this.answers.sessionType || "консультации";
            const f = this.answers.feelings.join(", ") || "не указаны";
            const n = this.answers.notes?.trim() || "—";
            const moodEmoji = this.getMoodEmoji();
            const moodDesc = this.getMoodDescription();
            const isAfter = s === "После консультации";
            const ts = new Date().toLocaleString('ru-RU');
            const rec = Date.now().toString().slice(-6);
            let afterLine = "";
            if (isAfter && after !== null) afterLine = `\n📈 Состояние после консультации: ${after}/10`;
            return `📊 *ДНЕВНИК ЭМОЦИЙ* #${rec}\n\n👤 *Номер:* ${userNumber}\n🕐 ${ts}\n📋 ${s}\n\n😊 Эмоции: ${e}/10\n😰 Тревога: ${a}/10\n😴 Сон: ${sl}/10\n⚡ Энергия: ${en}/10\n👥 Желание общаться: ${soc}/10\n🧘 Физика: ${p}/10${afterLine}\n🌟 Общий фон: ${moodEmoji} — ${moodDesc}\n\n💭 Чувства: ${f}\n\n${isAfter ? '💡 Инсайты' : '🎯 Заметки'}:\n${n}\n\n_Отправлено через Дневник эмоций_`;
        }

        sendToTelegram() { window.open(`https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(this.formatMessage())}`, '_blank'); }

        showChangeNumberModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-card"><h3>🔄 Изменить номер</h3><input id="newNum" placeholder="#1234567" value="${userNumber || ''}"><div class="modal-buttons"><button class="modal-cancel" id="cancelBtn">Отмена</button><button class="modal-save" id="saveBtn">Сохранить</button></div></div>`;
            document.body.appendChild(modal);
            setTimeout(() => modal.classList.add('active'), 10);
            const close = () => { modal.classList.remove('active'); setTimeout(() => modal.remove(), 300); };
            document.getElementById('cancelBtn').onclick = close;
            document.getElementById('saveBtn').onclick = () => {
                let val = document.getElementById('newNum').value.trim();
                if (!val) return alert("Введите номер");
                if (!val.startsWith('#')) val = '#' + val;
                userNumber = val;
                localStorage.setItem('userNumber', userNumber);
                close();
                alert(`✅ Номер изменён на ${userNumber}`);
                if (this.completed) this.renderResultScreen();
                else if (this.isRegistered) this.renderQuestionScreen();
                else this.renderWelcome();
            };
        }

        renderWelcome() {
            this.container.innerHTML = `<div class="card fade-in"><div class="welcome-card"><h1>Дневник эмоций</h1><p>ваше безопасное пространство</p><div class="number-input-wrapper"><input id="userNum" placeholder="номер клиента"></div><button class="welcome-btn" id="regBtn">продолжить</button></div><div class="content" style="padding-top: 0;"><p style="text-align:center; font-size:0.8rem; color:#9b8c7e;">💡 Номер выдаёт администратор. Нет номера? Напишите <strong>@${BOT_USERNAME}</strong></p></div></div>`;
            document.getElementById('regBtn').onclick = () => {
                let val = document.getElementById('userNum').value.trim();
                if (!val) return alert("Введите номер");
                if (!val.startsWith('#')) val = '#' + val;
                userNumber = val;
                localStorage.setItem('userNumber', userNumber);
                this.isRegistered = true;
                this.renderQuestionScreen();
            };
        }

        renderResultScreen() {
            const e = this.answers.emotionIntensity || 5;
            const p = this.answers.physicalState || 5;
            const a = this.answers.anxiety || 5;
            const sl = this.answers.sleep || 5;
            const en = this.answers.energy || 5;
            const soc = this.answers.social || 5;
            const after = this.answers.afterTone || null;
            const s = this.answers.sessionType || "консультации";
            const f = this.answers.feelings.join(", ") || "не указаны";
            const n = this.answers.notes?.trim() || "—";
            const moodEmoji = this.getMoodEmoji();
            const moodDesc = this.getMoodDescription();
            const isAfter = s === "После консультации";
            const label = isAfter ? "💡 Инсайты после консультации:" : "📝 Заметки перед консультацией:";
            const resp = this.getResponseCard();
            this.container.innerHTML = `<div class="settings-btn" id="settBtn">⚙️</div><div class="card"><div class="progress-area"><div class="progress-steps"><span class="step-badge">дневник готов</span><div class="step-bar-wrapper"><div class="step-bar-fill" style="width:100%"></div></div></div></div><div class="content"><div class="result-card"><div class="result-emoji">${moodEmoji}</div><h2>ваш эмоциональный снимок</h2><p><strong>номер:</strong> ${userNumber}</p><p><strong>${s}</strong></p><p>😊 эмоции ${e}/10 &nbsp;|&nbsp; 😰 тревога ${a}/10</p><p>😴 сон ${sl}/10 &nbsp;|&nbsp; ⚡ энергия ${en}/10 &nbsp;|&nbsp; 👥 общение ${soc}/10</p><p>🧘 физика ${p}/10 ${isAfter && after !== null ? `&nbsp;|&nbsp; 📈 после консультации ${after}/10` : ''}</p><p>${moodDesc}</p><hr/><div style="text-align:left;"><p><strong>💭 преобладающие эмоции:</strong> ${f}</p><p><strong>${label}</strong><br>${n}</p></div>${resp || ''}<button class="primary telegram-btn" id="sendBtn">📤 отправить администратору</button><button class="secondary" id="resetBtn">📝 заполнить заново</button></div><p style="text-align:center; font-size:0.75rem; margin-top:20px;">нажмите — откроется telegram с готовым текстом</p></div></div>`;
            document.getElementById('settBtn')?.addEventListener('click', () => this.showChangeNumberModal());
            document.getElementById('sendBtn')?.addEventListener('click', () => this.sendToTelegram());
            document.getElementById('resetBtn')?.addEventListener('click', () => this.reset());
        }

        renderQuestionScreen() {
            const qs = this.getQuestions();
            const q = qs[this.currentStep];
            const prog = this.getProgressPercent();
            const isFirst = this.currentStep === 0;
            const isLast = this.currentStep === qs.length - 1;
            let body = '';
            if (q.type === 'segment') {
                body = `<div class="segment-group">${q.options.map(opt => `<div class="segment-option ${this.answers.sessionType === opt ? 'selected' : ''}" data-val="${opt}">${opt}</div>`).join('')}</div>`;
            } else if (q.type === 'range') {
                const val = this.answers[q.id] !== undefined ? this.answers[q.id] : 5;
                let minLabel = "0 — минимум", maxLabel = "10 — максимум";
                if (q.id === 'sleep') { minLabel = "0 — очень плохо"; maxLabel = "10 — отлично"; }
                if (q.id === 'energy') { minLabel = "0 — полный упадок"; maxLabel = "10 — много энергии"; }
                if (q.id === 'social') { minLabel = "0 — совсем не хочется"; maxLabel = "10 — очень хочется"; }
                if (q.id === 'afterTone') { minLabel = "0 — стало хуже"; maxLabel = "10 — стало намного лучше"; }
                if (q.id === 'anxiety') { minLabel = "0 — нет тревоги"; maxLabel = "10 — очень сильная"; }
                body = `<div class="emotion-scale"><div class="current-value" id="curVal">${val} / 10</div><input type="range" id="rangeSl" min="0" max="10" step="1" value="${val}"><div style="display:flex; justify-content:space-between; margin-top:8px; font-size:0.75rem; color:#b7a18a;"><span>${minLabel}</span><span>${maxLabel}</span></div></div>`;
            } else if (q.type === 'multiselect') {
                body = `<div class="check-group">${q.options.map(emo => `<div class="emotion-chip ${this.answers.feelings.includes(emo) ? 'selected' : ''}" data-emo="${emo}">${emo}</div>`).join('')}</div><p style="font-size:0.7rem; margin-top:8px; color:#b7a18a;">✓ выберите несколько</p>`;
            } else if (q.type === 'textarea') {
                body = `<textarea id="notesTa" rows="4" placeholder="${q.placeholder}">${this.answers.notes || ''}</textarea>`;
            }
            this.container.innerHTML = `<div class="settings-btn" id="settBtn">⚙️</div><div class="card"><div class="progress-area"><div class="progress-steps"><span class="step-badge">${userNumber} · ${this.currentStep+1}/${qs.length}</span><div class="step-bar-wrapper"><div class="step-bar-fill" style="width:${prog}%"></div></div></div></div><div class="content"><h2>${q.text}</h2><div class="subheading">${q.id === 'sessionType' ? 'выберите контекст' : (q.id === 'notes' ? (this.answers.sessionType === 'После консультации' ? 'поделитесь впечатлениями' : 'что важно обсудить?') : 'передвиньте ползунок')}</div><div class="question">${body}</div><div class="actions"><button class="secondary" id="prevBtn" ${isFirst ? 'disabled' : ''}>← назад</button><button class="primary" id="nextBtn">${isLast ? 'завершить' : 'далее →'}</button></div></div></div>`;
            document.getElementById('settBtn')?.addEventListener('click', () => this.showChangeNumberModal());
            if (q.type === 'segment') {
                document.querySelectorAll('.segment-option').forEach(opt => { opt.onclick = () => { this.setAnswer('sessionType', opt.dataset.val); if (this.currentStep > 0) this.currentStep = 1; this.renderQuestionScreen(); }; });
            }
            if (q.type === 'range') {
                const sl = document.getElementById('rangeSl');
                const disp = document.getElementById('curVal');
                const update = () => {
                    const v = parseInt(sl.value);
                    disp.innerText = `${v} / 10`;
                    this.answers[q.id] = v;
                };
                sl.oninput = update;
                update();
            }
            if (q.type === 'multiselect') {
                document.querySelectorAll('.emotion-chip').forEach(ch => {
                    ch.onclick = () => {
                        const em = ch.dataset.emo;
                        let arr = [...this.answers.feelings];
                        if (arr.includes(em)) { arr = arr.filter(e => e !== em); ch.classList.remove('selected'); }
                        else { arr.push(em); ch.classList.add('selected'); }
                        this.answers.feelings = arr;
                    };
                });
            }
            if (q.type === 'textarea') document.getElementById('notesTa').oninput = (e) => this.answers.notes = e.target.value;
            document.getElementById('nextBtn').onclick = () => this.nextStep();
            if (!isFirst) document.getElementById('prevBtn').onclick = () => this.prevStep();
        }

        init() { if (this.isRegistered) this.renderQuestionScreen(); else this.renderWelcome(); }
    }
    new EmotionDiary(document.getElementById('app'));
</script>
</body>
</html>
